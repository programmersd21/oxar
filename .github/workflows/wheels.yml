name: wheels
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: "x86_64"
          - os: macos-latest
            arch: "arm64"
          - os: windows-latest
            arch: "AMD64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Cache cibuildwheel tool cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cache/cibuildwheel
            ~/AppData/Local/pypa/cibuildwheel/Cache
            ~/Library/Caches/cibuildwheel
          key: cibw-tools-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'pyproject.toml') }}
          restore-keys: |
            cibw-tools-${{ matrix.os }}-
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: "build"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CIBW_TEST_COMMAND: "python -c \"import oxar; print('installed oxar', oxar.__version__)\""
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CIBW_BEFORE_ALL_LINUX: "curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin --strip-components=1 sccache-v0.10.0-x86_64-unknown-linux-musl/sccache"
          CIBW_ENVIRONMENT_LINUX: "RUST_BACKTRACE=1 RUSTC_WRAPPER=sccache SCCACHE_GHA_ENABLED=true"
          CIBW_ENVIRONMENT_MACOS: "RUST_BACKTRACE=1 RUSTC_WRAPPER=sccache SCCACHE_GHA_ENABLED=true"
          CIBW_ENVIRONMENT_WINDOWS: "RUST_BACKTRACE=1 RUSTC_WRAPPER=sccache SCCACHE_GHA_ENABLED=true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx maturin==1.15.0 sdist -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
